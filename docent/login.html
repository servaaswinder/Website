---
title: Docent-login
description: Privépagina — inloggen voor docenten.
noindex: true
sitemap: false
---

<!DOCTYPE html>
<html lang="nl">
{% include head-nk.html %}
<body>
	{% include site-header-nk.html %}

	<main class="main" style="max-width: 480px; padding-bottom: 60px;">
		<section class="card">
			<form id="login-form">
				<div class="card__eyebrow">PRIVÉ · DOCENT</div>
				<h1 class="card__title">Docent-login</h1>
				<label class="field-label" for="email">E-mailadres</label>
				<input class="field" type="email" id="email" autocomplete="username" required />
				<label class="field-label" for="password">Wachtwoord</label>
				<input class="field" type="password" id="password" autocomplete="current-password" required />
				<div class="btns" style="margin-top: 20px;">
					<button id="btn-login" type="submit" class="btn btn--submit">Inloggen</button>
				</div>
			</form>
			<div id="mfa-form" class="hidden">
				<div class="card__eyebrow">PRIVÉ · DOCENT</div>
				<h1 class="card__title">2FA-verificatie</h1>
				<label class="field-label" for="mfa-code">6-cijferige code uit je authenticator-app</label>
				<input class="field" type="text" id="mfa-code" inputmode="numeric" placeholder="123456" autocomplete="one-time-code" />
				<div class="btns" style="margin-top: 20px;">
					<button id="btn-mfa" type="button" class="btn btn--submit">Verifiëren</button>
				</div>
			</div>
			<div id="error" class="error-msg"></div>
		</section>
	</main>

	{% include site-footer-nk.html %}

	<style>
		.field-label {
			display: block;
			font-family: var(--font-mono);
			font-size: 11.5px;
			letter-spacing: .1em;
			font-weight: 600;
			color: var(--accent);
			margin: 16px 0 6px;
			text-transform: uppercase;
		}
		.field {
			width: 100%;
			padding: 12px 14px;
			border-radius: 12px;
			border: 1px solid var(--btn-border);
			background: #fff;
			color: var(--ink);
			font-family: var(--font-body);
			font-size: 15px;
		}
		.field:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
		.btn--submit {
			background: var(--night-2);
			color: #fff;
			border-color: var(--night-2);
			cursor: pointer;
			font-family: var(--font-body);
		}
		.btn--submit:hover, .btn--submit:focus-visible { color: #fff; border-color: var(--accent); background: var(--accent); }
		.btn--submit:disabled { opacity: .6; cursor: wait; transform: none; }
		.error-msg { margin-top: 14px; color: #b3261e; font-size: 14px; }
		.hidden { display: none; }
	</style>

	<script type="module">
		import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
		import {
			getAuth, signInWithEmailAndPassword, onAuthStateChanged,
			getMultiFactorResolver, TotpMultiFactorGenerator,
			setPersistence, browserLocalPersistence
		} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

		const app = initializeApp({
			apiKey: "AIzaSyDkye8-F8VZQD30HzJQK1Z_9VNgEZPJayY",
			authDomain: "leerling-accounts.firebaseapp.com",
			projectId: "leerling-accounts",
			storageBucket: "leerling-accounts.firebasestorage.app",
			messagingSenderId: "884081904341",
			appId: "1:884081904341:web:5ce26ac295a4bf3d79305c",
		});
		const auth = getAuth(app);
		setPersistence(auth, browserLocalPersistence);

		// Alleen doorsturen naar eigen pagina's, nooit naar een extern adres uit de URL
		const requested = new URLSearchParams(location.search).get("redirect") || "/docent/demos.html";
		const target = requested.startsWith("/") && !requested.startsWith("//") ? requested : "/docent/demos.html";

		const errorDiv = document.getElementById("error");
		let mfaResolver = null;

		onAuthStateChanged(auth, (user) => {
			if (user) window.location.replace(target);
		});

		document.getElementById("login-form").addEventListener("submit", async (e) => {
			e.preventDefault();
			errorDiv.textContent = "";
			const btn = document.getElementById("btn-login");
			btn.disabled = true;
			try {
				await signInWithEmailAndPassword(auth,
					document.getElementById("email").value,
					document.getElementById("password").value);
				// onAuthStateChanged stuurt door
			} catch (error) {
				btn.disabled = false;
				if (error.code === "auth/multi-factor-auth-required") {
					mfaResolver = getMultiFactorResolver(auth, error);
					document.getElementById("login-form").classList.add("hidden");
					document.getElementById("mfa-form").classList.remove("hidden");
					document.getElementById("mfa-code").focus();
				} else {
					errorDiv.textContent = "Inloggen mislukt. Controleer je e-mailadres en wachtwoord.";
				}
			}
		});

		document.getElementById("mfa-code").addEventListener("keydown", (e) => {
			if (e.key === "Enter") document.getElementById("btn-mfa").click();
		});

		document.getElementById("btn-mfa").addEventListener("click", async () => {
			if (!mfaResolver) return;
			errorDiv.textContent = "";
			const hint = mfaResolver.hints.find(h => h.factorId === TotpMultiFactorGenerator.FACTOR_ID);
			if (!hint) { errorDiv.textContent = "Geen TOTP-methode gevonden op dit account."; return; }
			try {
				const assertion = TotpMultiFactorGenerator.assertionForSignIn(
					hint.uid, document.getElementById("mfa-code").value.trim());
				await mfaResolver.resolveSignIn(assertion);
				// onAuthStateChanged stuurt door
			} catch {
				errorDiv.textContent = "Foute code. Probeer het opnieuw.";
			}
		});
	</script>
</body>
</html>
