<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vis.js Skill Tree Demo</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Vis.js handles scrolling/zooming */
        }
        #mynetwork {
            width: 100%;
            height: 100%;
            border: 1px solid lightgray;
            background-color: #f9f9f9;
        }
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="controls">
    <h3>Vis.js Prototype</h3>
    <p>Sleep om te bewegen, scroll om te zoomen.</p>
</div>

<div id="mynetwork"></div>

<script type="text/javascript">
    // Create an array with nodes
    var nodes = new vis.DataSet([
        // Root
        {id: 'A3', label: '<b>Portfoliostartopdracht (A3)</b>\nMaak je eigen website', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        
        // Thema 1: Communiceren
        {id: 'A2', label: '<b>Communiceren (A2)</b>\nSamenwerken', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'A5', label: '<b>Onderzoeken (A5)</b>\nOnderzoeksmethoden', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'F2', label: '<b>Maatschappelijke aspecten (F2)</b>\nImpact op samenleving', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'A4', label: '<b>Oriënteren op studie en beroep (A4)</b>\nToekomstoriëntatie', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'A1', label: '<b>Informatievaardigheden (A1)</b>\nInfo zoeken', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'A7', label: '<b>Waarderen en oordelen (A7)</b>\nKritische blik', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'E2', label: '<b>Security (E2)</b>\nGegevens veilig houden', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'F4', label: '<b>Security (F4)</b>\nMaatregelen toepassen', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'F3', label: '<b>Privacy (F3)</b>\nReflecteren', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},

        // Thema 2: Modelleren
        {id: 'ModIntro', label: '<b>Cursus Leren Modelleren</b>\nIntroductie', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'A6', label: '<b>Modelleren (A6)</b>\nModellen opstellen', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'C5', label: '<b>Gestructureerde data (C5)</b>\nData organiseren', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'C1', label: '<b>Warming stripes (C1)</b>\nVisualiseren', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'C2', label: '<b>Identificeren (C2)</b>\nAnalyseren', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'B3', label: '<b>Automaten (B3)</b>\nToestandsdiagrammen', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'B1', label: '<b>Algoritme (B1)</b>\nStappenplannen', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'B2', label: '<b>Datastructuren (B2)</b>\nKies structuur', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'C3', label: '<b>Representateren (C3)</b>\nStructuren herkennen', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'D1', label: '<b>Ontwikkelen (D1)</b>\nVertaal naar ontwerp', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'D2', label: '<b>Inspecteren en aanpassen (D2)</b>\nTesten', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},

        // Thema 3: HTML
        {id: 'B4', label: '<b>Introductie HTML (B4)</b>\nNieuwe website', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},
        {id: 'F1', label: '<b>Usability (F1)</b>\nGebruiksvriendelijkheid', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},

        // Thema 4: Standaard-representaties
        {id: 'C4', label: '<b>Standaard-representaties (C4)</b>\nBinair en decimaal', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}},

        // Thema 5: Decompositie
        {id: 'E1', label: '<b>Decompositie (E1)</b>\nHardware componenten', shape: 'box', color: {background: '#fff', border: '#ccc'}, font: {multi: 'html'}}
    ]);

    // Create an array with edges
    var edges = new vis.DataSet([
        // Root connections
        {from: 'A3', to: 'A2'},
        {from: 'A3', to: 'ModIntro'},
        {from: 'A3', to: 'B4'},
        {from: 'A3', to: 'C4'},
        {from: 'A3', to: 'E1'},
        
        // Thema 1: Communiceren
        {from: 'A2', to: 'A5'},
        {from: 'A2', to: 'A4'},
        {from: 'A2', to: 'A1'},
        {from: 'A5', to: 'F2'},
        {from: 'A1', to: 'A7'},
        {from: 'A1', to: 'E2'},
        {from: 'E2', to: 'F4'},
        {from: 'F4', to: 'F3'},

        // Thema 2: Modelleren
        {from: 'ModIntro', to: 'A6'},
        {from: 'A6', to: 'C5'},
        {from: 'A6', to: 'B3'},
        {from: 'A6', to: 'C3'},
        {from: 'C5', to: 'C1'},
        {from: 'C5', to: 'C2'},
        {from: 'B3', to: 'B1'},
        {from: 'B1', to: 'B2'},
        {from: 'C3', to: 'D1'},
        {from: 'D1', to: 'D2'},

        // Thema 3: HTML
        {from: 'B4', to: 'F1'},
        
        // Cross-links (Multi-parent)
        {from: 'B4', to: 'B2', color: {color: 'red', dash: [5, 5]}}, 
        {from: 'F1', to: 'D2', color: {color: 'red', dash: [5, 5]}},
        {from: 'B4', to: 'F1'} // Duplicate in list? "Introductie HTML (B4) --> Usability (F1)" is already there.
    ]);

    // Create a network
    var container = document.getElementById('mynetwork');
    var data = {
        nodes: nodes,
        edges: edges
    };
    var options = {
        layout: {
            hierarchical: {
                direction: 'UD', // Up-Down
                sortMethod: 'directed', // Crucial for multi-parents
                nodeSpacing: 250, // Increased spacing for wider nodes
                levelSeparation: 150,
                shakeTowards: 'roots'
            }
        },
        edges: {
            smooth: {
                type: 'cubicBezier',
                forceDirection: 'vertical',
                roundness: 0.4
            },
            arrows: {
                to: {enabled: true, scaleFactor: 0.5}
            },
            color: {
                color: '#ccc',
                highlight: '#94a0b4'
            }
        },
        nodes: {
            borderWidth: 2,
            shadow: true,
            margin: 10,
            font: {
                face: 'Segoe UI',
                size: 14,
                color: '#333'
            },
            widthConstraint: { maximum: 200 } // Limit width to prevent super wide nodes
        },
        physics: false
    };
    var network = new vis.Network(container, data, options);
</script>

</body>
</html>
