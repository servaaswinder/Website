<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MWE 2: D3.js Tree</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            overflow: hidden; /* Zooming handles overflow */
        }
        .node circle {
            fill: #fff;
            stroke: steelblue;
            stroke-width: 3px;
        }
        .node text {
            font: 12px sans-serif;
        }
        .link {
            fill: none;
            stroke: #ccc;
            stroke-width: 2px;
        }
        #tree-container {
            width: 100vw;
            height: 100vh;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <div style="position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 5px;">
        <h1>Optie 2: D3.js Interactive Tree</h1>
        <p>Voordeel: Automatische layout, interactief (zoom/pan/collapse), professioneel.<br>
        Nadeel: Vereist Javascript data-structuur (JSON).</p>
    </div>

    <div id="tree-container"></div>

    <script>
        // 1. De Data (Hierarchie)
        const treeData = {
            "name": "Start (A3)",
            "description": "Maak website",
            "children": [
                {
                    "name": "Modelleren",
                    "description": "Introductie",
                    "children": [
                        { "name": "A6", "description": "Modellen" },
                        { "name": "C5", "description": "Gestructureerde data" }
                    ]
                },
                {
                    "name": "Communiceren (A2)",
                    "description": "Samenwerken",
                    "children": [
                        { "name": "A5", "description": "Onderzoeken" },
                        { "name": "A1", "description": "Info-vaardigheden" }
                    ]
                },
                {
                    "name": "HTML (B4)",
                    "description": "Nieuwe versie",
                    "children": [
                        { "name": "B2", "description": "Datastructuren" },
                        { "name": "F1", "description": "Usability" }
                    ]
                },
                { "name": "C4", "description": "Standaard-repr." },
                { "name": "E1", "description": "Decompositie" }
            ]
        };

        // 2. Setup Canvas
        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#tree-container").append("svg")
            .attr("width", width)
            .attr("height", height)
            .call(d3.zoom().on("zoom", (event) => {
                g.attr("transform", event.transform);
            }))
            .append("g")
            .attr("transform", "translate(100,50)"); // Initial margin

        const g = svg.append("g");

        const tree = d3.tree().size([height - 200, width - 400]); // Size of the tree layout

        // 3. Render Functie
        function update(source) {
            const root = d3.hierarchy(source);
            tree(root);

            // Links (Lijnen)
            g.selectAll(".link")
                .data(root.links())
                .enter().append("path")
                .attr("class", "link")
                .attr("d", d3.linkHorizontal()
                    .x(d => d.y)
                    .y(d => d.x));

            // Nodes (Rondjes + Tekst)
            const node = g.selectAll(".node")
                .data(root.descendants())
                .enter().append("g")
                .attr("class", "node")
                .attr("transform", d => "translate(" + d.y + "," + d.x + ")");

            // Cirkel
            node.append("circle")
                .attr("r", 10);

            // Titel
            node.append("text")
                .attr("dy", -15)
                .attr("x", 0)
                .style("text-anchor", "middle")
                .style("font-weight", "bold")
                .text(d => d.data.name);

            // Beschrijving
            node.append("text")
                .attr("dy", 20)
                .attr("x", 0)
                .style("text-anchor", "middle")
                .style("fill", "#555")
                .text(d => d.data.description);
        }

        update(treeData);

    </script>
</body>
</html>
