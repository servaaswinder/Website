<figure class="ts">
	<svg class="ts__svg" viewBox="0 0 660 380" role="img" aria-labelledby="ts-title ts-desc" xmlns="http://www.w3.org/2000/svg">
		<title id="ts-title">Animatie: een vallende kegel bereikt zijn eindsnelheid</title>
		<desc id="ts-desc">De kegel begint stil. De zwaartekracht blijft even groot, de luchtweerstand groeit met de snelheid. De snelheid neemt steeds minder snel toe, totdat de luchtweerstand even groot is als de zwaartekracht. Vanaf dat moment valt de kegel met een constante snelheid: de eindsnelheid.</desc>
		<defs>
			<clipPath id="ts-lucht"><rect x="10" y="20" width="230" height="340" rx="14" /></clipPath>
			<linearGradient id="ts-papier" x1="0" y1="0" x2="1" y2="0">
				<stop offset="0" stop-color="#dfe4f7" />
				<stop offset=".45" stop-color="#ffffff" />
				<stop offset="1" stop-color="#cfd6f1" />
			</linearGradient>
		</defs>

		<!-- linkerpaneel: kegel met krachten -->
		<rect x="10" y="20" width="230" height="340" rx="14" fill="#f7f8fd" stroke="#e8eaf4" />
		<g clip-path="url(#ts-lucht)" id="ts-strepen" stroke="#d7ddf2" stroke-width="2" stroke-linecap="round"></g>
		<path d="M75 176 L125 250 L175 176 Z" fill="url(#ts-papier)" stroke="#141b40" stroke-width="2.5" stroke-linejoin="round" />
		<ellipse cx="125" cy="176" rx="50" ry="9" fill="#f5f6fc" stroke="#141b40" stroke-width="2.5" />
		<g id="ts-fw">
			<line x1="125" y1="200" x2="125" y2="200" stroke="#2a34b8" stroke-width="5" stroke-linecap="round" />
			<path d="" fill="#2a34b8" />
			<text x="140" y="0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="20" font-style="italic" fill="#2a34b8">F<tspan font-size="13" dy="5">w</tspan></text>
		</g>
		<g id="ts-fz">
			<line x1="125" y1="200" x2="125" y2="320" stroke="#c2410c" stroke-width="5" stroke-linecap="round" />
			<path d="M116 314 L125 332 L134 314 Z" fill="#c2410c" />
			<text x="142" y="296" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="20" font-style="italic" fill="#c2410c">F<tspan font-size="13" dy="5">z</tspan></text>
		</g>
		<circle cx="125" cy="200" r="6" fill="#141b40" stroke="#fff" stroke-width="2" />

		<!-- rechterpaneel: v,t-diagram -->
		<g font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" fill="#565f80">
			<line x1="320" y1="320" x2="630" y2="320" stroke="#141b40" stroke-width="1.5" />
			<line x1="320" y1="320" x2="320" y2="40" stroke="#141b40" stroke-width="1.5" />
			<path d="M630 320 l-8 -4 v8 z M320 40 l-4 8 h8 z" fill="#141b40" />
			<text x="632" y="306" text-anchor="end" font-style="italic">t (s)</text>
			<text x="310" y="46" text-anchor="end" font-style="italic">v</text>
			<text x="312" y="324" text-anchor="end">0</text>
			<g id="ts-tticks"></g>
			<line id="ts-vt-lijn" x1="320" x2="620" y1="90" y2="90" stroke="#65708f" stroke-width="1.5" stroke-dasharray="6 5" opacity="0" />
			<text id="ts-vt-label" x="326" y="84" text-anchor="start" font-style="italic" fill="#141b40" font-size="15" opacity="0">v<tspan font-size="10" dy="4">t</tspan></text>
		</g>
		<polyline id="ts-grafiek" points="" fill="none" stroke="#141b40" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
		<circle id="ts-punt" cx="320" cy="320" r="5" fill="#141b40" />

		<text id="ts-status" x="475" y="372" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="14" fill="#565f80"></text>
	</svg>
	<figcaption class="ts__bar">
		<button class="btn" type="button" id="ts-knop">Afspelen</button>
		<span class="ts__meter" aria-live="polite"><span id="ts-v">v = 0,00 m/s</span> · <span id="ts-ratio">F<sub>w</sub> = 0 % van F<sub>z</sub></span></span>
		<span class="ts__note">Tien keer vertraagd afgespeeld.</span>
	</figcaption>
</figure>

<script>
(function () {
	var svg = document.querySelector('.ts__svg');
	if (!svg) return;
	var VT = 1.6, G = 9.81, TMAX = 0.6, SLOW = 10;          // m/s, m/s², s, vertraging
	var CX = 125, CY = 200, LZ = 120;                      // pijlen: zwaartekracht is LZ pixels
	var GX0 = 320, GX1 = 620, GY0 = 320, GYT = 90;         // grafiek: y van v_t
	var fw = document.getElementById('ts-fw'), fwLine = fw.querySelector('line'), fwHead = fw.querySelector('path'), fwText = fw.querySelector('text');
	var graf = document.getElementById('ts-grafiek'), punt = document.getElementById('ts-punt');
	var vtLijn = document.getElementById('ts-vt-lijn'), vtLabel = document.getElementById('ts-vt-label');
	var status = document.getElementById('ts-status'), knop = document.getElementById('ts-knop');
	var vOut = document.getElementById('ts-v'), rOut = document.getElementById('ts-ratio');
	var strepen = document.getElementById('ts-strepen');
	var NS = 'http://www.w3.org/2000/svg';

	// tijdas
	var ticks = document.getElementById('ts-tticks');
	for (var i = 1; i <= 6; i++) {
		var x = GX0 + (GX1 - GX0) * (i * 0.1) / TMAX;
		var l = document.createElementNS(NS, 'line');
		l.setAttribute('x1', x); l.setAttribute('x2', x); l.setAttribute('y1', GY0); l.setAttribute('y2', GY0 + 5);
		l.setAttribute('stroke', '#141b40');
		ticks.appendChild(l);
		var t = document.createElementNS(NS, 'text');
		t.setAttribute('x', x); t.setAttribute('y', GY0 + 20); t.setAttribute('text-anchor', 'middle');
		t.textContent = (i / 10).toFixed(1).replace('.', ',');
		ticks.appendChild(t);
	}

	// luchtstrepen die langs de kegel omhoog schuiven (de kegel valt)
	var streep = [];
	for (var s = 0; s < 14; s++) {
		var ln = document.createElementNS(NS, 'line');
		var sx = 25 + (s * 53) % 200;
		ln.setAttribute('x1', sx); ln.setAttribute('x2', sx);
		strepen.appendChild(ln);
		streep.push({ el: ln, y: (s * 97) % 340 });
	}
	function tekenStrepen() {
		streep.forEach(function (st) {
			st.el.setAttribute('y1', 20 + st.y);
			st.el.setAttribute('y2', 20 + st.y + 18);
		});
	}

	function snelheid(t) { var x = G * t / VT; return VT * (Math.exp(2 * x) - 1) / (Math.exp(2 * x) + 1); }
	function fmt(n, d) { return n.toFixed(d).replace('.', ','); }

	function teken(t) {
		var v = snelheid(t), r = (v / VT) * (v / VT);
		var top = CY - LZ * r;
		fwLine.setAttribute('y2', Math.min(CY, top + 10));
		fwHead.setAttribute('d', r < 0.05 ? '' : 'M' + (CX - 9) + ' ' + (top + 12) + ' L' + CX + ' ' + (top - 6) + ' L' + (CX + 9) + ' ' + (top + 12) + ' Z');
		fwText.setAttribute('y', top + 16);
		fwText.setAttribute('opacity', r < 0.08 ? 0 : 1);

		var pts = [], n = 60;
		for (var k = 0; k <= n; k++) {
			var tk = t * k / n;
			pts.push((GX0 + (GX1 - GX0) * tk / TMAX).toFixed(1) + ',' + (GY0 - (GY0 - GYT) * snelheid(tk) / VT).toFixed(1));
		}
		graf.setAttribute('points', pts.join(' '));
		punt.setAttribute('cx', GX0 + (GX1 - GX0) * t / TMAX);
		punt.setAttribute('cy', GY0 - (GY0 - GYT) * v / VT);

		var klaar = r > 0.99;
		vtLijn.setAttribute('opacity', klaar ? 1 : 0);
		vtLabel.setAttribute('opacity', klaar ? 1 : 0);
		status.textContent = t === 0 ? 'Loslaten: v = 0, dus nog geen luchtweerstand'
			: klaar ? 'Luchtweerstand = zwaartekracht: de snelheid blijft gelijk'
			: 'Luchtweerstand groeit, nettokracht wordt kleiner';
		vOut.textContent = 'v = ' + fmt(v, 2) + ' m/s';
		rOut.innerHTML = 'F<sub>w</sub> = ' + Math.round(r * 100) + ' % van F<sub>z</sub>';
	}

	var start = null, vorige = null, raf = null;
	function stap(nu) {
		if (start === null) { start = nu; vorige = nu; }
		var t = Math.min(TMAX, (nu - start) / 1000 / SLOW);
		var dt = (nu - vorige) / 1000 / SLOW; vorige = nu;
		var v = snelheid(t);
		streep.forEach(function (st) { st.y -= v * dt * 900; if (st.y < -20) st.y += 360; });
		tekenStrepen();
		teken(t);
		if (t < TMAX) { raf = requestAnimationFrame(stap); }
		else { knop.textContent = 'Opnieuw'; raf = null; }
	}
	function speel() {
		if (raf) cancelAnimationFrame(raf);
		start = null;
		knop.textContent = 'Speelt af…';
		raf = requestAnimationFrame(stap);
	}
	knop.addEventListener('click', speel);
	window.tsToonEind = function () { if (raf) cancelAnimationFrame(raf); raf = null; teken(TMAX); knop.textContent = 'Opnieuw'; };

	tekenStrepen();
	var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
	teken(reduce ? TMAX : 0);
	if (reduce) knop.textContent = 'Opnieuw';
})();
</script>
