<header class="site-header">
	<div class="site-header__bar">
		<a class="brand" href="{{ '/' | relative_url }}">
			<span class="brand__name">Servaas Winder</span>
			<span class="brand__sub">DOCENT · NORTHGO COLLEGE</span>
		</a>
		<button class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="nk-nav">&#9776;</button>
		<nav class="nav" aria-label="Hoofdmenu">
			<ul class="nav__links" id="nk-nav">
				<li><a href="{{ '/' | relative_url }}"{% if page.nav == "home" %} class="is-active"{% endif %}>Home</a></li>
				<li><a href="{{ '/#klassen' | relative_url }}"{% if page.nav == "natuurkunde" %} class="is-active"{% endif %}>Natuurkunde</a></li>
				<li><a href="https://northgo-informatica.nl" target="_blank" rel="noopener">Informatica</a></li>
			</ul>
		</nav>
	</div>
	<script>
		(function () {
			var toggle = document.querySelector(".nav-toggle");
			var links = document.getElementById("nk-nav");
			if (toggle && links) {
				toggle.addEventListener("click", function () {
					var open = links.classList.toggle("is-open");
					toggle.setAttribute("aria-expanded", open ? "true" : "false");
				});
			}
		})();
	</script>
</header>
