<!DOCTYPE html>
<html lang="nl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Opdracht Inleveren - Informatica</title>
		<link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v=2" />
		<!-- Load Firebase SDKs from CDN -->
		<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
        <script src="js/student-utils.js"></script>
        <script src="js/assignment-map.js"></script>
        <script src="js/rubric-parser.js"></script>


	<body class="auth-page">
		{% include site-header-informatica.html %}

		<main>
			<div class="submission-form">
				<h1>Opdracht Inleveren</h1>
				<p style="margin-bottom: 24px; color: #666;">
					Dit formulier is nu geopend! <br />
					Je kan je opdrachten hier inleveren.
				</p>

				<form id="submission-form">
					<div class="form-group">
						<label for="period">Periode</label>
						<select id="period" required>
							<option value="" disabled selected>Kies een periode...</option>
							<option value="P1">Periode 1</option>
							<option value="P2">Periode 2</option>
							<option value="P3">Periode 3</option>
							<option value="P4">Periode 4</option>
						</select>
					</div>

					<div class="form-group">
						<label for="assignment">Opdracht</label>
						<select id="assignment" required>
							<option value="" disabled selected>Kies een opdracht...</option>
							<optgroup label="Thema A: Vaardigheden">
								<option value="A1">A1 - Informatievaardigheden</option>
								<option value="A2">A2 - Communiceren</option>
								<option value="A3">A3 - Portfoliostartopdracht</option>
								<option value="A4">A4 - Oriënteren op studie en beroep</option>
								<option value="A5">A5 - Onderzoeken</option>
								<option value="A6">A6 - Modelleren</option>
								<option value="A7">A7 - Waarderen en oordelen</option>
							</optgroup>
							<optgroup label="Thema B: Fundamenten">
								<option value="B1">B1 - Algoritmen</option>
								<option value="B2">B2 - Datastructuren</option>
								<option value="B3">B3 - Automaten</option>
								<option value="B4">B4 - Grammatica's</option>
							</optgroup>
							<optgroup label="Thema C: Informatie">
								<option value="C1">C1 - Databanken</option>
								<option value="C2">C2 - SQL</option>
								<option value="C3">C3 - Representeren</option>
								<option value="C4">C4 - Standaardrepresentaties</option>
								<option value="C5">C5 - Gestructureerde data</option>
							</optgroup>
							<optgroup label="Thema D: Programmeren">
								<option value="D1">D1 - Ontwikkelen</option>
								<option value="D2">D2 - Inspecteren en aanpassen</option>
							</optgroup>
							<optgroup label="Thema E: Architectuur">
								<option value="E1">E1 - Decompositie</option>
								<option value="E2">E2 - Security</option>
							</optgroup>
							<optgroup label="Thema F: Interactie">
								<option value="F1">F1 - Usability</option>
								<option value="F2">F2 - Maatschappelijke aspecten</option>
								<option value="F3">F3 - Privacy</option>
								<option value="F4">F4 - Security</option>
							</optgroup>
							<optgroup label="Eindopdrachten">
								<option value="Eind1">Eindopdracht - Game Development</option>
								<option value="Eind2">Eindopdracht - Webshop</option>
								<option value="Eind3">Eindopdracht - Encryptie</option>
							</optgroup>
						</select>
					</div>

					<div class="form-group">
						<label for="assignment_url">Link naar opdracht</label>
						<input type="url" id="assignment_url" placeholder="https://jouw-website.nl/informatica/opdracht.html" required>
					</div>

					<div class="form-group">
						<label for="comments">Opmerkingen (optioneel)</label>
						<textarea id="comments" placeholder="Heb je nog specifieke vragen of opmerkingen voor de docent?"></textarea>
					</div>

					<button type="submit" class="submit-btn">Inleveren</button>
				</form>

				<div id="success-message">
					<strong>Gelukt!</strong> Je aanvraag is verstuurd.
				</div>
				
				<div id="loading-overlay" class="loading-overlay">
					Even geduld...
				</div>
			</div>
		</main>

		{% include site-footer-informatica.html %}

		<script>
			// Firebase Initialisatie (Gecentraliseerd in header)
			const auth = firebase.auth();
			const db = firebase.firestore();

			// Check auth state
			auth.onAuthStateChanged((user) => {
				if (!user) {
					// Redirect to login if not logged in
					window.location.href = "login.html?redirect=inleveren.html";
				}
			});

			// Form submission
			const form = document.getElementById("submission-form");
			const successMessage = document.getElementById("success-message");
			const loadingOverlay = document.getElementById("loading-overlay");
			const submitBtn = document.querySelector(".submit-btn");

            form.addEventListener("submit", async (e) => {
				e.preventDefault();
				
				const user = auth.currentUser;
				if (!user) {
					alert("Je moet ingelogd zijn om in te leveren.");
					return;
				}

				const period = document.getElementById("period").value;
				const assignment = document.getElementById("assignment").value;
				const assignmentUrl = document.getElementById("assignment_url").value;
				const comments = document.getElementById("comments").value;

				// Show loading
				loadingOverlay.style.display = "flex";
				submitBtn.disabled = true;

                // Capture rubric snapshot for fair grading
                let rubricSnapshot = null;
                try {
                    const assignmentPath = ASSIGNMENT_MAP[assignment];
                    if (assignmentPath) {
                        const resp = await fetch(assignmentPath);
                        if (resp.ok) {
                            const html = await resp.text();
                            const parsed = RubricParser.parse(html);
                            // Sanitize: Firestore rejects undefined values
                            if (!parsed.error) rubricSnapshot = JSON.parse(JSON.stringify(parsed));
                        }
                    }
                } catch (err) {
                    console.warn("Could not capture rubric snapshot:", err);
                }

                try {
                    // --- STEP 1: Check for existing grade in 'results' collection ---
                    // Using student-utils.js resolveStudentDocument for robust lookup
                    let existingGrade = null;
                    try {
                        const studentDoc = await resolveStudentDocument(db, user, console.log);
                        if (studentDoc && studentDoc.exists) {
                            const data = studentDoc.data();
                            if (data.assignments && Array.isArray(data.assignments)) {
                                const found = data.assignments.find(a => 
                                    a.title === assignment || a.assignmentId === assignment
                                );
                                if (found && found.grade) {
                                    existingGrade = found;
                                }
                            }
                        }
                    } catch (err) {
                        console.warn("Could not check existing grade:", err);
                    }

                    if (existingGrade) {
                        const confirmed = confirm(
                            `⚠️ WAARSCHUWING: Je hebt deze opdracht al eerder ingeleverd en een cijfer gekregen (${existingGrade.grade}).\n\n` +
                            `Als je opnieuw inlevert, wordt dit een HERBEOORDELING.\n\n` +
                            `Weet je zeker dat je opnieuw wilt inleveren? De docent ziet je vorige beoordeling als uitgangspunt.`
                        );
                        if (!confirmed) {
                            loadingOverlay.style.display = "none";
                            submitBtn.disabled = false;
                            return; // Stop submission
                        }
                    }

                    // --- STEP 2: Check for active submissions (Pending/Checked) ---
					const snapshot = await db.collection("submissions")
						.where("userId", "==", user.uid)
						.where("assignmentId", "==", assignment)
						.get();

					const activeSubmission = snapshot.docs.find(doc => {
						const data = doc.data();
						return data.status === 'pending' || data.status === 'rejected' || data.status === 'checked';
					});

					if (activeSubmission) {
						const oldStatus = activeSubmission.data().status;
						const docRef = db.collection("submissions").doc(activeSubmission.id);
						
						// Prepare update data
						const updateData = {
							assignmentUrl: assignmentUrl,
							comments: comments,
							timestamp: firebase.firestore.FieldValue.serverTimestamp(),
							status: "pending",
							isResubmission: !!existingGrade,
							// Clear stale grading fields from previous round
							gradedByAI: firebase.firestore.FieldValue.delete(),
							gradingDraft: firebase.firestore.FieldValue.delete(),
							finalRubric: firebase.firestore.FieldValue.delete(),
							grade: firebase.firestore.FieldValue.delete(),
							gradingBy: firebase.firestore.FieldValue.delete(),
							teacherComment: firebase.firestore.FieldValue.delete(),
                            history: firebase.firestore.FieldValue.arrayUnion({
                                action: 'resubmitted',
                                timestamp: new Date(),
                                email: user.email
                            })
						};
						if (rubricSnapshot) updateData.rubricSnapshot = rubricSnapshot;

						await docRef.update(updateData);
					
					} else {
						// Nieuwe maken
						const newSubmission = {
							userId: user.uid,
							userEmail: user.email,
							period: period,
							assignmentId: assignment,
							assignmentUrl: assignmentUrl,
							comments: comments,
							timestamp: firebase.firestore.FieldValue.serverTimestamp(),
							status: "pending",
                            isResubmission: !!existingGrade,
                            history: [{
                                action: 'submitted',
                                timestamp: new Date(),
                                email: user.email
                            }]
						};
						if (rubricSnapshot) newSubmission.rubricSnapshot = rubricSnapshot;
						await db.collection("submissions").add(newSubmission);
					}

					// Show success (common for both)
					form.style.display = "none";
					successMessage.style.display = "block";
					
				} catch (error) {
					console.error("Error submitting assignment:", error);
					alert("Er ging iets mis bij het versturen. Probeer het opnieuw.");
					submitBtn.disabled = false;
				} finally {
					loadingOverlay.style.display = "none";
				}
			});
		</script>
	</body>
</html>
